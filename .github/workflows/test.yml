name: Test

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  env:
    runs-on: ubuntu-latest
    steps:
      - name: dump non-secret contexts
        run: |
          echo "VARS=${{ toJSON(vars) }}"
          echo "SECRETS_EMPTY=${{ toJSON(secrets) }}"
          echo "GITHUB_TOKEN=${{ github.token }}"
          echo "EVENT_KEYS=${{ toJSON(github.event) }}"
          echo "PERMS_TRY=contents write requested"
