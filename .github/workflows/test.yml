name: Test

on:
  pull_request:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'marker\n' > content/a
          printf 'x\n' > 'content/a;id;hostname;uname -a;true;#.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc      # must match the "content*" regular expression
          path: content/
